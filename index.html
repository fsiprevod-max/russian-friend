<script>;

const DATA = window.RF_DATA;
const AUDIO = window.RF_AUDIO;
const RU_DELAY = 800;
const AFTER_SERBIAN_DELAY = 3000;
const FIRST_REPEAT_AFTER_NEW = 10;
const REVIEW_DELAYS = [2*60*1000, 10*60*1000, 30*60*1000, 24*60*60*1000];
const $ = id => document.getElementById(id);

let running = false;
let index = 0;
let order = [];
let timer = null;
let reviewEvents = [];
let newExposureHistory = [];
let lastSpokenId = null;
let audioCtx = null;
let audioBuffers = new Map();
let audioSources = new Set();
let wakeLock = null;
let stayAwake = false;
let voices = [];
let awakeVideo = null;

function shuffle(a) {
  const x = a.slice();
  for (let i=x.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [x[i],x[j]] = [x[j],x[i]];
  }
  return x;
}

function makeOrder() {
  // First 10 are freshly shuffled; after that the original Anki deck order is preserved.
  const firstTen = shuffle(DATA.slice(0,10).map(s => s.id));
  const rest = DATA.slice(10).map(s => s.id);
  order = firstTen.concat(rest);
  index = 0;
  newExposureHistory = [];
}

function sentenceById(id) {
  return DATA.find(s => s.id === id);
}

function scheduleReview(id, dueAt, stage) {
  reviewEvents.push({ id, dueAt, stage });
}

function scheduleFirstRepeat(id) {
  scheduleReview(id, Date.now(), 0);
}

function maybeScheduleFirstRepeat() {
  if (newExposureHistory.length >= FIRST_REPEAT_AFTER_NEW) {
    const id = newExposureHistory[newExposureHistory.length - FIRST_REPEAT_AFTER_NEW];
    if (!reviewEvents.some(e => e.id === id && e.stage === 0)) scheduleFirstRepeat(id);
  }
}

function takeDueReview() {
  const now = Date.now();
  const due = reviewEvents
    .map((event, i) => ({...event, index:i}))
    .filter(event => event.dueAt <= now && event.id !== lastSpokenId)
    .sort((a,b) => a.dueAt - b.dueAt);
  if (!due.length) return null;
  const picked = due[0];
  reviewEvents.splice(picked.index, 1);
  return picked;
}

function nextPendingItem() {
  const review = takeDueReview();
  if (review) return { type:'review', id:review.id, stage:review.stage };
  if (index < order.length) {
    const id = order[index++];
    newExposureHistory.push(id);
    maybeScheduleFirstRepeat();
    return { type:'new', id };
  }
  return null;
}

function nextWaitMs() {
  const now = Date.now();
  const candidates = reviewEvents
    .filter(event => event.id !== lastSpokenId)
    .map(event => Math.max(0, event.dueAt - now));
  return candidates.length ? Math.min(...candidates) : 1000;
}

function clearTimer() {
  if (timer) { clearTimeout(timer); timer=null; }
}

function delay(ms) {
  return new Promise(resolve => { timer=setTimeout(()=>{timer=null;resolve();},ms); });
}

function setPhase(text) {}
function setText(text) { $('sentence').textContent = text; }

function getRussianVoice() {
  return voices.find(v => /^ru(?:-|$)/i.test(v.lang)) || null;
}

function refreshVoices() {
  if (!('speechSynthesis' in window)) { voices = []; return; }
  try { voices = speechSynthesis.getVoices().filter(v => /^ru(?:-|$)/i.test(v.lang)); } catch (_) { voices = []; }
}
refreshVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = refreshVoices;
awakeVideo = $('awakeVideo');

function speakRussian(text) {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) { resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    const v = getRussianVoice();
    if (v) u.voice = v;
    u.rate = 1;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

async function unlockAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
  } catch (_) {}
}

async function getSerbianBuffer(id) {
  if (audioBuffers.has(id)) return audioBuffers.get(id);
  if (!audioCtx) throw new Error('AudioContext unavailable');
  const b64 = AUDIO[String(id)];
  if (!b64) throw new Error('Missing Serbian audio '+id);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const p = audioCtx.decodeAudioData(bytes.buffer);
  audioBuffers.set(id,p);
  return p;
}

async function playSerbian(id) {
  await unlockAudio();
  const buffer = await getSerbianBuffer(id);
  return new Promise(resolve => {
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    audioSources.add(source);
    source.onended = () => { audioSources.delete(source); resolve(); };
    source.start();
  });
}

async function startAwakeFallback() {
  if (!awakeVideo || !stayAwake) return;
  try {
    awakeVideo.currentTime = 0;
    await awakeVideo.play();
  } catch (_) {}
}

function stopAwakeFallback() {
  if (!awakeVideo) return;
  try { awakeVideo.pause(); } catch (_) {}
}

async function acquireWakeLock() {
  if (!stayAwake) return;
  if (navigator.wakeLock && window.isSecureContext) {
    try {
      if (!wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (_) { wakeLock = null; }
  }
  await startAwakeFallback();
}

async function releaseWakeLock() {
  try { if (wakeLock) await wakeLock.release(); } catch (_) {}
  wakeLock = null;
  stopAwakeFallback();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && stayAwake) acquireWakeLock();
});

async function playItem(item) {
  if (!running) return;
  const s = sentenceById(item.id);
  if (!s) return;
  setPhase(item.type === 'review' ? 'Review' : 'Russian');
  setText(s.russian);
  // Decode Serbian audio while Russian is being spoken.
  const serbianReady = unlockAudio().then(() => getSerbianBuffer(s.id)).catch(() => null);
  await delay(RU_DELAY);
  if (!running) return;
  await speakRussian(s.russian);
  if (!running) return;
  setPhase('Serbian');
  setText(s.serbian);
  const buffer = await serbianReady;
  if (!running) return;
  if (buffer && audioCtx && audioCtx.state === 'running') {
    await new Promise(resolve => {
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      audioSources.add(source);
      source.onended = () => { audioSources.delete(source); resolve(); };
      source.start();
    });
  }
  if (!running) return;
  lastSpokenId = s.id;

  // After the first review, use the gentler repeat intervals: 2 min, 10 min, 30 min, 1 day.
  if (item.type === 'review' && item.stage < REVIEW_DELAYS.length) {
    scheduleReview(s.id, Date.now() + REVIEW_DELAYS[item.stage], item.stage + 1);
  }

  setPhase('');
  await delay(AFTER_SERBIAN_DELAY);
}

async function runLesson() {
  while (running) {
    const item = nextPendingItem();
    if (!item) {
      if (!reviewEvents.length) {
        makeOrder();
        continue;
      }
      await delay(nextWaitMs());
      continue;
    }
    if (item.id === lastSpokenId) {
      reviewEvents.push({ id:item.id, dueAt:Date.now()+1000, stage:item.stage });
      continue;
    }
    await playItem(item);

    // Start the next deck cycle immediately, while older reviews remain scheduled.
    if (running && index >= order.length) makeOrder();
  }
}

async function start() {
  if (running) return;
  running = true;
  reviewEvents = [];
  newExposureHistory = [];
  lastSpokenId = null;
  makeOrder();
  await unlockAudio();
  if (stayAwake) acquireWakeLock();
  $('start').disabled = true;
  $('stop').disabled = false;
  runLesson();
}

async function stop() {
  running = false;
  clearTimer();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  for (const source of audioSources) {
    try { source.stop(); } catch (_) {}
  }
  audioSources.clear();
  await releaseWakeLock();
  $('start').disabled = false;
  $('stop').disabled = true;
  setPhase('Stopped');
}

$('start').addEventListener('click', start);
$('stop').addEventListener('click', stop);
$('awake').addEventListener('change', async e => {
  stayAwake = e.target.checked;
  if (stayAwake) await acquireWakeLock();
  else await releaseWakeLock();
});
</script>
